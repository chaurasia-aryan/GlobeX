[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "globex-trade-data-pipeline"
version = "1.0.0"
description = "Cross-Border Trade Intelligence Dataset Acquisition & Feature Engineering Pipeline for GLOBEX Trade OS"
readme = "DATA_PIPELINE.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "numpy>=1.26.0,<2.3.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "tenacity>=8.3.0",
    "rapidfuzz>=3.8.0",
    "datasets>=2.19.0",
    "huggingface-hub>=0.23.0"
]

[project.optional-dependencies]
deeplearning = [
    "torch>=2.2.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "config*"]
