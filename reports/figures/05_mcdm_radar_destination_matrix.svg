  <text x='400' y='285' fill='#94A3B8' font-size='10' font-family='monospace' text-anchor='start'>Port Logistics (w=0.10)</text>
  <text x='300' y='330' fill='#94A3B8' font-size='10' font-family='monospace' text-anchor='middle'>Buyer Density (w=0.10)</text>
  <text x='195' y='285' fill='#94A3B8' font-size='10' font-family='monospace' text-anchor='end'>FX Stability (w=0.05)</text>
  <text x='180' y='175' fill='#94A3B8' font-size='10' font-family='monospace' text-anchor='end'>Forecast Growth (w=0.20)</text>
  
  <!-- UAE Polygon (Score 81.4) -->
  <polygon points='300,125 395,172 375,265 295,302 230,268 208,175' fill='#10B981' fill-opacity='0.3' stroke='#10B981' stroke-width='2.5'/>
  
  <!-- USA Polygon (Score 78.8) -->
  <polygon points='300,135 345,188 385,260 305,305 220,265 225,182' fill='#38BDF8' fill-opacity='0.25' stroke='#38BDF8' stroke-width='2' stroke-dasharray='4'/>
  
  <!-- Legend -->
  <rect x='420' y='350' width='160' height='55' fill='#1E293B' rx='8' stroke='#334155'/>
  <line x1='435' y1='368' x2='455' y2='368' stroke='#10B981' stroke-width='3'/>
