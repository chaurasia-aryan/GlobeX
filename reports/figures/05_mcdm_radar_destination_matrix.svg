  <polygon points='300,120 400,170 380,270 300,310 220,270 200,170' fill='none' stroke='#334155' stroke-width='1'/>
  <polygon points='300,150 370,185 355,255 300,280 245,255 230,185' fill='none' stroke='#334155' stroke-width='1'/>
  <polygon points='300,180 340,200 330,240 300,250 270,240 260,200' fill='none' stroke='#334155' stroke-width='1'/>
  
  <!-- Axis Labels -->
  <text x='300' y='108' fill='#94A3B8' font-size='10' font-family='monospace' text-anchor='middle'>Revealed Demand (w=0.25)</text>
