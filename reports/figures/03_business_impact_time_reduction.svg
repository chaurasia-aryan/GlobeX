<svg width='750' height='380' viewBox='0 0 750 380' xmlns='http://www.w3.org/2000/svg' style='background:#0F172A;font-family:system-ui,-apple-system,sans-serif;'>
  <rect width='750' height='380' fill='#0F172A' rx='16'/>
  <text x='40' y='42' fill='#FFFFFF' font-size='17' font-weight='bold'>Cross-Border Trade Verification &amp; Clearance Latency</text>
  <text x='40' y='64' fill='#94A3B8' font-size='12' font-family='monospace'>Traditional Manual Process vs. National Single Window vs. GlobeX Autonomous OS</text>
  
  <!-- Y-Axis Labels -->
  <text x='160' y='125' fill='#E2E8F0' font-size='12' text-anchor='end'>Traditional Manual Trade</text>
  <text x='160' y='195' fill='#E2E8F0' font-size='12' text-anchor='end'>Legacy Single Window</text>
  <text x='160' y='265' fill='#34D399' font-size='12' font-weight='bold' text-anchor='end'>GlobeX Intelligence OS</text>
  
  <!-- Bars -->
  <!-- Traditional: 18 Days (width 480) -->
  <rect x='180' y='105' width='480' height='32' rx='6' fill='#EF4444' opacity='0.85'/>
  <text x='670' y='126' fill='#FCA5A5' font-size='12' font-weight='bold' font-family='monospace'>14–21 Days</text>
  
  <!-- Single Window: 6 Days (width 160) -->
  <rect x='180' y='175' width='160' height='32' rx='6' fill='#F59E0B' opacity='0.85'/>
  <text x='350' y='196' fill='#FCD34D' font-size='12' font-weight='bold' font-family='monospace'>5–7 Days</text>
  
  <!-- GlobeX: 2 Hours (width 12) -->
  <rect x='180' y='245' width='18' height='32' rx='6' fill='#10B981'/>
  <text x='210' y='266' fill='#34D399' font-size='13' font-weight='bold' font-family='monospace'>&lt; 2 Hours (-99.2% Latency)</text>
  
  <!-- X-Axis Line -->
  <line x1='180' y1='300' x2='680' y2='300' stroke='#334155' stroke-width='1.5'/>
  <text x='180' y='325' fill='#64748B' font-size='10' font-family='monospace'>0h</text>
  <text x='340' y='325' fill='#64748B' font-size='10' font-family='monospace'>5 Days</text>
  <text x='500' y='325' fill='#64748B' font-size='10' font-family='monospace'>10 Days</text>
  <text x='660' y='325' fill='#64748B' font-size='10' font-family='monospace'>20 Days</text>
</svg>