  <line x1='80' y1='310' x2='740' y2='310' stroke='#334155' stroke-dasharray='4' stroke-width='1'/>
  
  <text x='70' y='104' fill='#64748B' font-size='10' font-family='monospace' text-anchor='end'>100k</text>
  <text x='70' y='174' fill='#64748B' font-size='10' font-family='monospace' text-anchor='end'>75k</text>
  <text x='70' y='244' fill='#64748B' font-size='10' font-family='monospace' text-anchor='end'>50k</text>
  <text x='70' y='314' fill='#64748B' font-size='10' font-family='monospace' text-anchor='end'>25k</text>
  
