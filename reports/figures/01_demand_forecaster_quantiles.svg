<svg width='800' height='420' viewBox='0 0 800 420' xmlns='http://www.w3.org/2000/svg' style='background:#0F172A;font-family:system-ui,-apple-system,sans-serif;'>
  <defs>
    <linearGradient id='coneGrad' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#10B981' stop-opacity='0.4'/>
      <stop offset='100%' stop-color='#10B981' stop-opacity='0.05'/>
    </linearGradient>
  </defs>
  <rect width='800' height='420' fill='#0F172A' rx='16'/>
  <text x='40' y='42' fill='#FFFFFF' font-size='18' font-weight='bold'>GlobeX Deep GRU Bilateral Demand Forecaster</text>
  <text x='40' y='64' fill='#94A3B8' font-size='12' font-family='monospace'>Quantile Pinball Loss Calibration (P10 · P50 · P90 Intervals)</text>
  
  <!-- Grid Lines -->
