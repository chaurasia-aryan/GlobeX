  <polygon points='100,260 160,248 220,230 280,215 340,190 400,175 460,185 520,160 580,135 640,118 700,95 700,165 640,185 580,205 520,230 460,250 400,240 340,255 280,270 220,285 160,295 100,300' fill='url(#coneGrad)'/>
  
